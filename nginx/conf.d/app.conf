upstream django_app {
    server web:8000;
}

# =============================================================
# BACKEND: backend.bevingshulpnoord.com
# =============================================================

# HTTP Port 80: Redirect to HTTPS & Certbot ACME Challenge
server {
    listen 80;
    server_name backend.bevingshulpnoord.com 191.218.162.194;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Port 443: Proxy to Django Gunicorn Container
server {
    listen 443 ssl;
    server_name backend.bevingshulpnoord.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/backend.bevingshulpnoord.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.bevingshulpnoord.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}


# =============================================================
# FRONTEND: bevingshulpnoord.nl (Redirects .com -> .nl)
# =============================================================

# HTTP Port 80: Redirect bevingshulpnoord.com & www.bevingshulpnoord.com to https://bevingshulpnoord.nl
server {
    listen 80;
    server_name bevingshulpnoord.com www.bevingshulpnoord.com;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bevingshulpnoord.nl$request_uri;
    }
}

# HTTP Port 80: Primary domain bevingshulpnoord.nl & www.bevingshulpnoord.nl (Redirect to HTTPS)
server {
    listen 80;
    server_name bevingshulpnoord.nl www.bevingshulpnoord.nl;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

