# HTTPS Port 443: Main Frontend proxy for bevingshulpnoord.nl
server {
    listen 443 ssl;
    server_name bevingshulpnoord.nl www.bevingshulpnoord.nl;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/bevingshulpnoord.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bevingshulpnoord.nl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}