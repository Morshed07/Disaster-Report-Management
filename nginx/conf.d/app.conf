upstream django_app {
    server web:8000;
}

# Backend API server block: backend.bevingshulpnoord.com
server {
    listen 80;
    server_name backend.bevingshulpnoord.com 191.218.162.194 _;

    client_max_body_size 50M;

    # Static files served directly by Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files (user uploads, photos) served directly by Nginx
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all API requests and Django views to Gunicorn container
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# Frontend Web App server block: bevingshulpnoord.com & www.bevingshulpnoord.com
server {
    listen 80;
    server_name bevingshulpnoord.com www.bevingshulpnoord.com;

    client_max_body_size 50M;

    # Default option A: Static SPA build files (React/Vite/Next export)
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Option B: Proxy to Frontend Node/Next.js service container (if using docker frontend service)
    # location / {
    #     proxy_pass http://frontend:3000;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

